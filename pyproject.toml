[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-runtime"
version = "0.1.0"
description = "A local persistent IPython runtime for AI agents"
requires-python = ">=3.11"
dependencies = ["jupyter-client>=8.6,<9", "ipykernel>=6.29,<8", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2", "httpx>=0.27,<1"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
ai-runtime = "ai_runtime.__main__:main"
ai-runtime-mcp = "ai_runtime.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "examples/live-lab", "examples/neon"]
